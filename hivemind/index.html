<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>HIVEMIND</title>
<link rel="preload" as="script" href="sim.js" />
<link rel="preload" as="script" href="game.js" />
<link rel="preload" as="script" href="menu.js" />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="dns-prefetch" href="https://0.peerjs.com" />
<style>
#sk{position:fixed;inset:0;z-index:48;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,240,255,.12),rgba(7,9,15,.6) 70%),#07090f;pointer-events:none}
#sk b{font:600 44px/1 Geist,system-ui,sans-serif;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px #3cf0ff,0 0 28px rgba(60,240,255,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07090f;color:#e8ecf5;font:500 13px/1.3 Geist,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button,#pop,#end{pointer-events:auto}
.gl{background:rgba(14,18,30,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:14px}
#top{position:absolute;top:10px;left:10px;padding:8px 14px}
#ag{font-size:28px;font-weight:600;display:block;line-height:1}
#pc,#sp{font-size:12px;opacity:.75;margin-right:8px}
#sp{color:#ffd84d;opacity:1}
#gr{display:block;margin-top:4px;font:600 12px Geist,system-ui,sans-serif;color:#bfe8ff;white-space:nowrap}
#gr.go{color:#ff6b78;text-shadow:0 0 10px rgba(255,59,77,.7);animation:ocr 1.2s ease-out infinite}
#top{pointer-events:auto;cursor:pointer}
#pop .al{display:flex;gap:6px;align-items:center}#pop .al span{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}#pop small{opacity:.7}
#feed small{opacity:.7}#feed button{margin-left:6px;min-height:28px;padding:0 10px;font:inherit;color:inherit;background:#161c2b;border:1px solid rgba(255,255,255,.14);border-radius:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#gr.go{animation:none}}
#lb{position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:18px;min-width:150px;font-size:12px}
#lb div{display:flex;gap:6px;align-items:center;padding:2px 0}
#lb i{width:9px;height:9px;border-radius:50%;flex:none}
#lb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb small{font-size:12px;opacity:.8}
#bar button.on span{color:#07090f}
#lb .me{font-weight:600;color:#fff}
#ping{position:absolute;top:56px;left:10px;padding:4px 10px;border-radius:10px;font:400 12px 'Geist Mono',monospace;display:none}
#feed{position:absolute;top:84px;left:10px;display:flex;flex-direction:column;gap:5px}
#feed div{padding:6px 10px;font-size:12px;animation:f 4s forwards}
@keyframes f{0%{opacity:0;transform:translateX(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
#bar button,#pop button,#end button{position:relative;overflow:hidden;min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#161c2b;color:#e8ecf5;font:600 13px Geist,system-ui,sans-serif;cursor:pointer}
#bar button.on{background:#e8ecf5;color:#07090f}
#bar b{position:absolute;left:0;bottom:0;height:3px;background:#ffd84d;width:0}
#bar button span{position:relative}
#bar button.aim{border-color:#ff3b4d;color:#fff;box-shadow:0 0 0 1px #ff3b4d,0 0 18px rgba(255,59,77,.75);animation:aimg .9s ease-in-out infinite alternate}
@keyframes aimg{to{box-shadow:0 0 0 1px #ff3b4d,0 0 30px rgba(125,255,90,.6)}}
#ag.oc{color:#bff9ff;text-shadow:0 0 10px #3cf0ff,0 0 22px rgba(60,240,255,.7)}
#sp.oc{display:inline-block;color:#3cf0ff;font-weight:600;animation:ocr 1.2s ease-out infinite}
@keyframes ocr{0%{transform:translateY(3px);opacity:.5}50%{opacity:1}100%{transform:translateY(-3px);opacity:.6}}
@media (prefers-reduced-motion:reduce){#bar button.aim,#sp.oc{animation:none}}
#pop{position:absolute;display:none;padding:10px;gap:6px;flex-direction:column;min-width:150px}
#pop p{margin:0 0 4px;font-weight:600}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,9,15,.7)}
#end .gl{padding:24px 28px;text-align:center;min-width:240px}
#end h1{font-size:44px;margin:0}
#end p{margin:6px 0;opacity:.85}
#end button{margin-top:14px;background:#e8ecf5;color:#07090f}
#top{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));padding-right:58px}
#lb{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
#ping{top:calc(66px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
#feed{top:calc(104px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
#bar{bottom:calc(12px + env(safe-area-inset-bottom))}
#snd{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#161c2b;color:#e8ecf5;font-size:18px;cursor:pointer;pointer-events:auto}
#keys{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));display:none;gap:10px;font:400 12px 'Geist Mono',monospace;opacity:.6;white-space:nowrap}
#keys kbd{padding:1px 6px;border:1px solid rgba(255,255,255,.25);border-radius:5px;font:inherit}
@media (hover:hover) and (pointer:fine){#keys{display:flex}}
@media (orientation:landscape) and (max-height:500px){
#bar{left:auto;bottom:auto;top:50%;right:calc(10px + env(safe-area-inset-right));transform:translateY(-50%);flex-direction:column}
#lb{right:calc(130px + env(safe-area-inset-right))}#keys{display:none}}
#pz{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:9px;background:rgba(255,216,77,.14);border:1px solid rgba(255,216,77,.5);color:#ffd84d;font:600 12px 'Geist Mono',monospace}
#abx{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center}
#abx button{pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.abb{position:relative;width:80px;height:80px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(14,18,30,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#e8ecf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px Geist,system-ui,sans-serif;letter-spacing:.04em}
.abb .rg{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;background:conic-gradient(#ffd84d calc((1 - var(--cd,0))*360deg),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.abb .em{font-size:28px;line-height:1}
.abb small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:9px;background:#161c2b;border:1px solid rgba(255,255,255,.14);font:400 12px 'Geist Mono',monospace;white-space:nowrap}
.abb small:empty{display:none}
.abb kbd{position:absolute;top:-4px;right:-4px;display:none;padding:0 5px;border-radius:5px;background:#161c2b;border:1px solid rgba(255,255,255,.25);font:400 12px 'Geist Mono',monospace}
@media (hover:hover) and (pointer:fine){.abb kbd{display:block}}
.abb.cd .em,.abb.cd span{opacity:.55}
.abb.poor small{color:#ff6b78;border-color:rgba(255,59,77,.7)}
.abb.rdy{border-color:#ffd84d;animation:rdy 1.4s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.55)}50%{box-shadow:0 0 0 9px rgba(255,216,77,0),0 0 24px rgba(255,216,77,.45)}}
.abb.aim{border-color:#ff3b4d;box-shadow:0 0 0 1px #ff3b4d,0 0 18px rgba(255,59,77,.75);animation:aimg .9s ease-in-out infinite alternate}
#vxx{display:none;width:64px;height:64px;border-radius:50%;border:0;background:#ff3b4d;color:#fff;font:600 30px/1 Geist,system-ui,sans-serif;box-shadow:0 4px 18px rgba(255,59,77,.5)}
#vxx.on{display:block}
@media (max-width:640px){#bar{left:calc(10px + env(safe-area-inset-left));transform:none}#abx{flex-direction:column}}
@media (orientation:landscape) and (max-height:500px){#bar{left:auto;transform:translateY(-50%)}#abx{flex-direction:row;right:calc(84px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.abb.rdy,.abb.aim{animation:none}.abb.rdy{box-shadow:0 0 18px rgba(255,216,77,.5)}}
#fxco{position:fixed;left:50%;top:32%;z-index:40;pointer-events:none;transform:translate(-50%,-50%);font:700 clamp(28px,8vw,56px)/1 Geist,system-ui,sans-serif;letter-spacing:.03em;color:#fff;white-space:nowrap;text-shadow:0 0 18px rgba(60,240,255,.8),0 3px 0 rgba(0,0,0,.5);opacity:0}
#fxco.go{animation:co 1.5s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes co{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.96)}}
#end{overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#end .fxend{position:relative;z-index:2;max-width:92vw}
#end .fxr{font-size:88px;line-height:1;margin:6px 0 0}#end .fxr.gold{color:#ffd84d;text-shadow:0 0 24px rgba(255,216,77,.6)}
#end .fxt{font-weight:600;opacity:1}#end .fxs{font-size:12px;opacity:.65}
#end .fxst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
#end .fxst div{background:#161c2b;border-radius:10px;padding:8px 6px}#end .fxst b{display:block;font-size:18px}#end .fxst span{font-size:12px;opacity:.7}
#end .fxrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#end .fxrow button{background:#161c2b;color:#e8ecf5}#end .fxrow button.p{background:#e8ecf5;color:#07090f}
#end .cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;z-index:1;animation:cf 2.5s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:420px){#end .fxst{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){#fxco.go{animation:co 1.5s steps(1) forwards}#end .cf{display:none}}
/* one visual system: radius, spacing, glass, type and a z-index scale (map < HUD < toasts < popovers < modal) */
:root{--r-s:10px;--r-m:14px;--r-pill:999px;--sp-1:6px;--sp-2:10px;--sp-3:14px;--fs-s:12px;--fs-m:13px;--fs-l:28px;
--glass:rgba(14,18,30,.78);--glass-solid:rgba(14,18,30,.96);--line:rgba(255,255,255,.12);--blur:blur(10px);--focus:#3cf0ff;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
--z-map:0;--z-hud:10;--z-toast:20;--z-pop:30;--z-modal:40}
#c{z-index:var(--z-map)}#hud{z-index:var(--z-hud)}
.gl{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-m);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.gl,.abb{background:var(--glass-solid)}}
#top,#lb,#ping,#bar,#abx,#spec{z-index:var(--z-hud)}#feed{z-index:var(--z-toast)}#pop{z-index:var(--z-pop)}#end{z-index:var(--z-modal)}
#bar button,#pop button,#end button,#feed button,#snd{border-radius:var(--r-s);font-size:var(--fs-m)}
#lb,#feed div,#pc,#sp,#gr{font-size:var(--fs-s)}#ag{font-size:var(--fs-l)}
#feed{max-width:min(360px,calc(100vw - 20px - var(--sl) - var(--sr)))}#feed div{padding:var(--sp-1) var(--sp-2);border-radius:var(--r-s)}
#feed button{min-height:44px;min-width:44px;margin-top:4px}
#pop button{min-height:44px}
#spec{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sb));padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill);font:600 var(--fs-m) Geist,system-ui,sans-serif;letter-spacing:.08em;color:#e8ecf5;white-space:nowrap}
button:focus{outline:none}button:focus-visible,#top:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.abb:focus-visible,#vxx:focus-visible{outline-offset:4px}
/* phones in portrait (360×640 and up): top HUD and leaderboard share the top row, toasts sit above the controls, clear of the ability column */
@media (max-width:640px) and (orientation:portrait){
#top{max-width:calc(56vw - 14px);padding:var(--sp-1) 54px var(--sp-1) var(--sp-2)}#ag{font-size:22px}
#lb{min-width:0;width:calc(44vw - 16px);max-width:170px;padding:var(--sp-1) 8px}#lb i{width:8px;height:8px}
#feed{top:auto;bottom:calc(76px + var(--sb));left:calc(10px + var(--sl));max-width:calc(100vw - 124px - var(--sl) - var(--sr))}
#bar{padding:4px;gap:4px;bottom:calc(12px + var(--sb))}#bar button{padding:0 8px}
#abx{gap:10px;bottom:calc(14px + var(--sb))}.abb{width:72px;height:72px}.abb .em{font-size:24px}
#ping{top:calc(108px + var(--st))}}
@media (max-width:360px) and (orientation:portrait){#lb small{display:none}}
@media (prefers-reduced-motion:reduce){#feed div{animation:none}.abb.rdy,.abb.aim,#bar button.aim,#gr.go,#sp.oc{animation:none!important}#end .cf{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sk" aria-hidden="true"><b>HIVEMIND</b></div>
<div id="hud" style="display:none">
<div id="top" class="gl"><b id="ag">0</b><span id="pc"></span><span id="sp"></span><span id="gr" style="display:none"></span><span id="pz" style="display:none"></span></div>
<div id="lb" class="gl"></div>
<div id="feed"></div>
<div id="pop" class="gl"></div>
<div id="bar" class="gl"></div>
<div id="abx"><button type="button" id="vxx" aria-label="Cancel virus aim">✕</button></div>
<div id="end"></div>
<div id="ping" class="gl"></div>
<div id="keys" aria-hidden="true"><span><kbd>1</kbd>–<kbd>4</kbd> send %</span><span><kbd>Q</kbd> virus (aim) · right-click/<kbd>Esc</kbd> cancel</span><span><kbd>E</kbd> firewall overcharge</span><span>scroll zoom · drag pan</span></div>
</div>
<script defer src="sim.js"></script><script defer src="bots.js"></script><script defer src="diplo.js"></script><script defer src="fx.js"></script><script defer src="game.js"></script><script defer src="menu.js"></script><script defer src="net.js"></script>
</body>
</html>
